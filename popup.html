<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Traduction Rapide</title>
  <style>
    body { margin: 0; width: 280px; font-family: system-ui, "Segoe UI", sans-serif; font-size: 14px; color: #1f2937; background: #fff; }
    header { background: #2563eb; color: #fff; padding: 12px 14px; font-weight: 700; font-size: 15px; }
    main { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 14px; }
    label.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    select { font: inherit; padding: 4px 6px; border-radius: 6px; border: 1px solid #d1d5db; }
    fieldset { border: 1px solid #e5e7eb; border-radius: 8px; padding: 8px 10px; margin: 0; }
    legend { font-size: 12px; color: #6b7280; padding: 0 4px; }
    fieldset label { display: flex; gap: 6px; align-items: flex-start; margin: 4px 0; cursor: pointer; }
    small { color: #6b7280; }
    .hint { font-size: 12px; color: #6b7280; margin: 0; }
    @media (prefers-color-scheme: dark) {
      body { background: #1f2937; color: #e5e7eb; }
      select { background: #111827; color: #e5e7eb; border-color: #4b5563; }
      fieldset { border-color: #374151; }
      small, .hint, legend { color: #9ca3af; }
    }
  </style>
</head>
<body>
  <header>文A Traduction Rapide</header>
  <main>
    <label class="row">Activée <input type="checkbox" id="enabled"></label>
    <label class="row">Traduire vers <select id="targetLang"></select></label>
    <fieldset>
      <legend>Quand je surligne du texte</legend>
      <label><input type="radio" name="mode" value="auto"> <span>Afficher la traduction tout de suite</span></label>
      <label><input type="radio" name="mode" value="icon"> <span>Afficher une petite icône <small>(je clique pour traduire)</small></span></label>
    </fieldset>
    <p class="hint">Astuce : clic droit sur une sélection → « Traduire », et Échap pour fermer la bulle.</p>
  </main>
  <script src="languages.js"></script>
  <script src="popup.js"></script>
</body>
</html>
